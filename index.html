<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Stamper</title>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<!-- ADDED: JSZip for batch export -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root { --bg:#f4f4f5; --panel:#fff; --text:#18181b; --muted:#71717a; --border:#e4e4e7; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f0f11; --panel:#1a1a1d; --text:#f4f4f5; --muted:#a1a1aa; --border:#2e2e33; --accent:#3b82f6; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#0f0f11; --panel:#1a1a1d; --text:#f4f4f5; --muted:#a1a1aa; --border:#2e2e33; --accent:#3b82f6; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .preview { order:-1; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], select { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:14px; }
  input[type=range] { width:100%; }
  input[type=color] { width:100%; height:34px; border:1px solid var(--border); border-radius:6px; background:none; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { padding:10px 12px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; width:100%; margin-top:8px; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:2px dashed var(--border); border-radius:10px; padding:24px; text-align:center; cursor:pointer; color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #status { font-size:12px; color:var(--muted); margin-top:8px; min-height:16px; }
  #status.warn { color:#d97706; }
  details { margin-top:12px; }
  summary { cursor:pointer; font-size:13px; font-weight:600; }
  .preview { display:flex; align-items:center; justify-content:center; min-height:300px; }
  canvas { max-width:100%; max-height:80vh; height:auto; box-shadow:0 2px 12px rgba(0,0,0,.2); }
  .empty { color:var(--muted); }
</style>
<!-- ADDED: batch section styles -->
<style>
  #batchSection { max-width:1400px; margin:16px auto; }
  #batchSection h2 { margin:0 0 12px; font-size:16px; }
  #batchGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  #batchGallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:16px; }
  .batchCard { background:var(--bg); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .batchCard canvas { display:block; width:100%; height:auto; max-height:none; box-shadow:none; }
  .batchCard .meta { padding:8px; }
  .batchCard .fname { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  .batchCard input[type=text] { font-size:12px; padding:6px 8px; }
  .batchActions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .batchActions button { width:auto; margin-top:0; }
</style>
</head>
<body>
<header>
  <h1>Image Stamper</h1>
  <p>Add a photo to stamp a grey bar across the top with its date, time and GPS coordinates from the photo's metadata.</p>
</header>
<main>
  <section class="panel">
    <!-- ADDED: multiple attribute so the same picker can take a batch -->
    <div id="drop">Tap or drop a photo here<input id="file" type="file" accept="image/*" multiple hidden></div>
    <div id="status"></div>

    <label>Date / time (left, set to when you add the photo)</label>
    <input id="left" type="text">
    <label>Latitude line (right)</label>
    <input id="right1" type="text">
    <label>Longitude line (right)</label>
    <input id="right2" type="text">

    <button id="download" disabled>Download stamped image</button>

    <details>
      <summary>More options</summary>
      <label>Extra line under the date (optional, e.g. address)</label>
      <input id="line2" type="text">
      <button id="geocode" class="secondary" disabled>Look up address from coordinates</button>

      <div class="row">
        <div><label>Bar colour</label><input id="barColor" type="color" value="#262626"></div>
        <div><label>Text colour</label><input id="textColor" type="color" value="#e8e8e8"></div>
      </div>
      <label>Bar opacity: <span id="opVal"></span></label>
      <input id="opacity" type="range" min="0" max="100" value="62">
      <label>Bar size (% of image width): <span id="hVal"></span></label>
      <input id="height" type="range" min="4" max="16" step="0.5" value="8">
      <label>Save as</label>
      <select id="outFmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select>
      <button id="reset" class="secondary">Reset text from photo metadata</button>
    </details>
  </section>

  <section class="panel preview">
    <canvas id="canvas" hidden></canvas>
    <div id="empty" class="empty">Your stamped photo will show here.</div>
  </section>
</main>

<!-- ADDED: batch section (hidden until 2+ photos are selected) -->
<section id="batchSection" class="panel" hidden>
  <h2>Batch mode — <span id="batchCount">0</span> photos</h2>
  <div id="batchGrid">
    <div><label>Start time</label><input id="bStart" type="text" placeholder="YYYY-MM-DDTHH:MM:SS"></div>
    <div><label>Sequence mode</label>
      <select id="bMode">
        <option value="grouped">Grouped per minute</option>
        <option value="even">Evenly spaced</option>
        <option value="interval">Fixed interval</option>
      </select>
    </div>
    <div id="bDurWrap"><label>Total spread (minutes)</label><input id="bDur" type="number" value="5" min="0" step="1" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;"></div>
    <div id="bIntWrap" hidden><label>Interval (seconds)</label><input id="bInt" type="number" value="30" min="1" step="1" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;"></div>
  </div>
  <div class="batchActions">
    <button id="bZip">Download all as ZIP</button>
    <button id="bClear" class="secondary">Clear batch</button>
  </div>
  <div id="batchGallery"></div>
</section>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let img = null, meta = { date: null, lat: null, lon: null }, fileName = 'photo';
let uploadedAt = null;

const status = (msg, warn) => { $('status').textContent = msg; $('status').className = warn ? 'warn' : ''; };

$('drop').onclick = () => $('file').click();
/* ADDED: route single vs. multi selection */
$('file').onchange = e => {
  const files = e.target.files;
  if (!files || !files.length) return;
  if (files.length > 1) loadBatch(files);
  else load(files[0]);
};
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
/* ADDED: route single vs. multi on drop */
$('drop').addEventListener('drop', e => {
  const files = e.dataTransfer.files;
  if (!files || !files.length) return;
  if (files.length > 1) loadBatch(files);
  else load(files[0]);
});

async function load(file) {
  fileName = file.name.replace(/\.[^.]+$/, '');
  meta = { date: null, lat: null, lon: null };
  status('Reading metadata…');
  try {
    const data = await exifr.parse(file, { gps: true, tiff: true, exif: true });
    if (data) {
      meta.date = data.DateTimeOriginal || data.CreateDate || data.ModifyDate || null;
      if (typeof data.latitude === 'number' && typeof data.longitude === 'number') { meta.lat = data.latitude; meta.lon = data.longitude; }
    }
  } catch (err) { console.warn(err); }

  const msgs = [];
  if (meta.lat == null) msgs.push('No GPS data in this photo. Type the coordinates in by hand. (On iPhone, tap Options and turn on "Location" before sharing the photo.)');
  status(msgs.length ? msgs.join(' ') : 'GPS found in metadata.', msgs.length > 0);

  uploadedAt = new Date();
  fillFields();
  $('line2').value = '';
  $('geocode').disabled = meta.lat == null;

  const im = new Image();
  im.onload = () => { img = im; $('canvas').hidden = false; $('empty').hidden = true; $('download').disabled = false; draw(); };
  im.onerror = () => status('This browser can\'t display this file type. HEIC works in Safari; otherwise convert the photo to JPG first.', true);
  im.src = URL.createObjectURL(file);
}

const pad = n => String(n).padStart(2, '0');
// e.g. "11/01/2025 04:47 AM PDT"
function fmtDate(d) {
  const h = d.getHours() % 12 || 12;
  let tz = '';
  try { tz = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(d).find(p => p.type === 'timeZoneName').value; } catch {}
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} ${pad(h)}:${pad(d.getMinutes())} ${d.getHours() < 12 ? 'AM' : 'PM'} ${tz}`.trim();
}
function fillFields() {
  $('left').value = fmtDate(uploadedAt);
  $('right1').value = meta.lat == null ? 'lat ' : `lat ${meta.lat}`;
  $('right2').value = meta.lon == null ? 'lng ' : `lng ${meta.lon}`;
}

function draw() {
  if (!img) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  canvas.width = W; canvas.height = H;
  ctx.drawImage(img, 0, 0, W, H);

  // Proportions measured from the reference stamp: bar ≈ 8% of width,
  // text ≈ 2.6% of width, two right-aligned coordinate lines.
  const unit = W * (+$('height').value / 100);
  const extra = $('line2').value.trim();
  const barH = Math.round(unit * (extra ? 1.35 : 1));
  ctx.globalAlpha = +$('opacity').value / 100;
  ctx.fillStyle = $('barColor').value;
  ctx.fillRect(0, 0, W, barH);
  ctx.globalAlpha = 1;

  let size = unit * 0.33;
  const setFont = s => ctx.font = `400 ${s}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  const left = $('left').value, r1 = $('right1').value, r2 = $('right2').value;
  const padL = W * 0.013, padR = W * 0.004;
  setFont(size);
  const fits = () => ctx.measureText(left).width + Math.max(ctx.measureText(r1).width, ctx.measureText(r2).width) + padL * 3 < W;
  while (size > 6 && !fits()) { size *= 0.95; setFont(size); }

  ctx.fillStyle = $('textColor').value;
  ctx.textBaseline = 'middle';
  const y1 = unit * 0.35, y2 = unit * 0.71;
  ctx.textAlign = 'right';
  ctx.fillText(r1, W - padR, y1);
  ctx.fillText(r2, W - padR, y2);
  ctx.textAlign = 'left';
  ctx.fillText(left, padL, unit * 0.5);

  if (extra) {
    let s2 = size * 0.85; setFont(s2);
    const maxW = W - padL * 2 - Math.max(ctx.measureText(r1).width, ctx.measureText(r2).width);
    while (s2 > 6 && ctx.measureText(extra).width > maxW) { s2 *= 0.95; setFont(s2); }
    ctx.fillText(extra, padL, unit * 1.05);
  }
}

['left','right1','right2','line2','barColor','textColor','opacity','height'].forEach(id => $(id).addEventListener('input', draw));
$('reset').onclick = () => { if (img) { fillFields(); draw(); } };
const syncLabels = () => { $('opVal').textContent = $('opacity').value + '%'; $('hVal').textContent = $('height').value + '%'; };
$('opacity').addEventListener('input', syncLabels); $('height').addEventListener('input', syncLabels); syncLabels();

$('geocode').onclick = async () => {
  if (meta.lat == null) return;
  $('geocode').disabled = true; $('geocode').textContent = 'Looking up…';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${meta.lat}&lon=${meta.lon}&zoom=18&addressdetails=1`);
    const j = await r.json();
    const a = j.address || {};
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const city = a.city || a.town || a.village || a.suburb || '';
    $('line2').value = [street, city, a.state].filter(Boolean).join(', ') || j.display_name || '';
    draw();
  } catch { status('Address lookup failed. Type the address in by hand.', true); }
  $('geocode').disabled = false; $('geocode').textContent = 'Look up address from coordinates';
};

// Inside a claude.ai artifact, plain download links are blocked, so use the viewer's save prompt there.
let downloads = null;
if (window.claude?.use) {
  $('geocode').hidden = true;
  claude.use('downloads').then(d => { downloads = d; });
}

$('download').onclick = () => {
  const type = $('outFmt').value;
  const name = `${fileName}-stamped.${type === 'image/png' ? 'png' : 'jpg'}`;
  canvas.toBlob(async b => {
    if (downloads) {
      try { await downloads.save({ filename: name, data: b }); status('Saved ' + name + '.'); }
      catch (e) { if (e?.code !== 'declined') status('Couldn\'t save the image here. Press and hold (or right-click) the photo and choose Save.', true); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, type, 0.92);
};

/* ============================================================
   ADDED: BATCH MODE
   Nothing above this line has been modified.
   ============================================================ */
let batchItems = [];

const toLocalDT = d =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

async function loadBatch(files) {
  batchItems = [];
  status(`Reading metadata for ${files.length} photos…`);

  for (const file of files) {
    const item = {
      file,
      name: file.name.replace(/\.[^.]+$/, ''),
      exifDate: null,
      lat: null,
      lon: null,
      outDate: new Date(),
      img: null,
      _el: null,
    };
    try {
      const data = await exifr.parse(file, { gps: true, tiff: true, exif: true });
      if (data) {
        item.exifDate = data.DateTimeOriginal || data.CreateDate || data.ModifyDate || null;
        if (typeof data.latitude === 'number' && typeof data.longitude === 'number') {
          item.lat = data.latitude;
          item.lon = data.longitude;
        }
      }
    } catch (err) { console.warn(err); }
    batchItems.push(item);
  }

  // Sort oldest capture first; photos without a date go last, original order otherwise.
  batchItems.sort((a, b) => {
    const ta = a.exifDate ? a.exifDate.getTime() : Infinity;
    const tb = b.exifDate ? b.exifDate.getTime() : Infinity;
    return ta - tb;
  });

  // Default start time = earliest capture time we found, rounded to the minute.
  const times = batchItems.map(i => i.exifDate?.getTime()).filter(Number.isFinite);
  const start = times.length ? new Date(Math.min(...times)) : new Date();
  start.setSeconds(0, 0);
  $('bStart').value = toLocalDT(start);

  // Preload each image so previews and export can use it.
  await Promise.all(batchItems.map(item => new Promise(resolve => {
    const im = new Image();
    im.onload = () => { item.img = im; resolve(); };
    im.onerror = () => resolve();
    im.src = URL.createObjectURL(item.file);
  })));

  $('batchSection').hidden = false;
  $('batchCount').textContent = batchItems.length;
  applyBatchSequence();
  renderBatchGallery();
  status(`${batchItems.length} photos loaded in batch mode.`);
}

function applyBatchSequence() {
  const n = batchItems.length;
  if (!n) return;

  const raw = $('bStart').value.trim();
  const t0 = raw ? new Date(raw).getTime() : Date.now();
  if (!Number.isFinite(t0)) return;

  const mode = $('bMode').value;
  const spreadMin = Math.max(0, Number($('bDur').value) || 0);
  const stepSec = Math.max(1, Number($('bInt').value) || 1);

  batchItems.forEach((item, i) => {
    let offsetMs = 0;
    if (mode === 'even') {
      offsetMs = n === 1 ? 0 : (i * spreadMin * 60000) / (n - 1);
    } else if (mode === 'grouped') {
      // 8 photos over 5 min → 9:00, 9:00, 9:01, 9:01, 9:02, 9:03, 9:03, 9:04
      offsetMs = Math.floor((i * spreadMin) / n) * 60000;
    } else {
      offsetMs = i * stepSec * 1000;
    }
    item.outDate = new Date(t0 + Math.round(offsetMs));
  });
}

function batchOpts(item) {
  return {
    left: fmtDate(item.outDate),
    r1: item.lat == null ? 'lat ' : `lat ${item.lat}`,
    r2: item.lon == null ? 'lng ' : `lng ${item.lon}`,
    extra: $('line2').value.trim(),
    barColor: $('barColor').value,
    textColor: $('textColor').value,
    opacity: +$('opacity').value,
    barHeightPct: +$('height').value,
  };
}

// Same stamp logic as draw(), parameterized so it can render to any canvas.
function drawStampTo(c, image, W, H, o) {
  c.drawImage(image, 0, 0, W, H);

  const unit = W * (o.barHeightPct / 100);
  const barH = Math.round(unit * (o.extra ? 1.35 : 1));
  c.globalAlpha = o.opacity / 100;
  c.fillStyle = o.barColor;
  c.fillRect(0, 0, W, barH);
  c.globalAlpha = 1;

  let size = unit * 0.33;
  const setFont = s => c.font = `400 ${s}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  const padL = W * 0.013, padR = W * 0.004;
  setFont(size);
  const fits = () =>
    c.measureText(o.left).width +
    Math.max(c.measureText(o.r1).width, c.measureText(o.r2).width) +
    padL * 3 < W;
  while (size > 6 && !fits()) { size *= 0.95; setFont(size); }

  c.fillStyle = o.textColor;
  c.textBaseline = 'middle';
  const y1 = unit * 0.35, y2 = unit * 0.71;
  c.textAlign = 'right';
  c.fillText(o.r1, W - padR, y1);
  c.fillText(o.r2, W - padR, y2);
  c.textAlign = 'left';
  c.fillText(o.left, padL, unit * 0.5);

  if (o.extra) {
    let s2 = size * 0.85; setFont(s2);
    const maxW = W - padL * 2 - Math.max(c.measureText(o.r1).width, c.measureText(o.r2).width);
    while (s2 > 6 && c.measureText(o.extra).width > maxW) { s2 *= 0.95; setFont(s2); }
    c.fillText(o.extra, padL, unit * 1.05);
  }
}

function renderBatchGallery() {
  const gallery = $('batchGallery');
  gallery.innerHTML = '';

  batchItems.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'batchCard';

    const c = document.createElement('canvas');
    const meta = document.createElement('div');
    meta.className = 'meta';

    const name = document.createElement('div');
    name.className = 'fname';
    name.textContent = `${String(i + 1).padStart(2, '0')}. ${item.name}`;
    name.title = item.file.name;

    const input = document.createElement('input');
    input.type = 'text';
    input.value = toLocalDT(item.outDate);
    input.addEventListener('change', () => {
      const d = new Date(input.value);
      if (!isNaN(d)) {
        item.outDate = d;
        drawBatchPreview(item);
      } else {
        input.value = toLocalDT(item.outDate);
      }
    });

    meta.append(name, input);
    card.append(c, meta);
    gallery.append(card);

    item._el = { canvas: c, input };
    drawBatchPreview(item);
  });
}

function drawBatchPreview(item) {
  if (!item.img || !item._el) return;
  const canvas = item._el.canvas;
  const maxW = 400;
  const scale = Math.min(1, maxW / item.img.naturalWidth);
  const W = Math.max(1, Math.round(item.img.naturalWidth * scale));
  const H = Math.max(1, Math.round(item.img.naturalHeight * scale));
  canvas.width = W;
  canvas.height = H;
  const c = canvas.getContext('2d');
  drawStampTo(c, item.img, W, H, batchOpts(item));
}

function refreshBatchPreviews() {
  if (!$('batchSection').hidden) {
    batchItems.forEach(drawBatchPreview);
  }
}

// Hook into the existing style controls so batch previews follow along.
['line2','barColor','textColor','opacity','height'].forEach(id =>
  $(id).addEventListener('input', refreshBatchPreviews));

$('bMode').addEventListener('change', () => {
  const fixed = $('bMode').value === 'interval';
  $('bIntWrap').hidden = !fixed;
  $('bDurWrap').hidden = fixed;
  applyBatchSequence();
  refreshBatchPreviews();
});
['bStart', 'bDur', 'bInt'].forEach(id => $(id).addEventListener('change', () => {
  applyBatchSequence();
  refreshBatchPreviews();
}));

$('bClear').addEventListener('click', () => {
  batchItems = [];
  $('batchGallery').innerHTML = '';
  $('batchSection').hidden = true;
  $('file').value = '';
  status('');
});

$('bZip').addEventListener('click', async () => {
  if (!batchItems.length) return;
  if (typeof JSZip === 'undefined') {
    status('ZIP library failed to load. Check your connection and reload.', true);
    return;
  }

  const btn = $('bZip');
  btn.disabled = true;

  try {
    const zip = new JSZip();
    const type = $('outFmt').value;
    const ext = type === 'image/png' ? 'png' : 'jpg';

    for (let i = 0; i < batchItems.length; i++) {
      const item = batchItems[i];
      status(`Stamping ${i + 1}/${batchItems.length}…`);
      if (!item.img) continue;

      const c = document.createElement('canvas');
      c.width = item.img.naturalWidth;
      c.height = item.img.naturalHeight;
      drawStampTo(c.getContext('2d'), item.img, c.width, c.height, batchOpts(item));

      const blob = await new Promise(res =>
        c.toBlob(res, type, type === 'image/jpeg' ? 0.92 : undefined));
      if (!blob) continue;

      const fname = `${String(i + 1).padStart(3, '0')}_${item.name}-stamped.${ext}`;
      zip.file(fname, blob);

      // Let the UI breathe on large batches.
      await new Promise(r => setTimeout(r, 0));
    }

    status('Building ZIP…');
    const out = await zip.generateAsync(
      { type: 'blob', compression: 'STORE' },
      m => status(`Zipping… ${Math.round(m.percent)}%`)
    );

    const name = `stamped-${Date.now()}.zip`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 15000);
    status(`Done — ${batchItems.length} file(s) saved.`);
  } catch (err) {
    console.error(err);
    status('Batch export failed: ' + err.message, true);
  } finally {
    btn.disabled = false;
  }
});
/* ==================== END BATCH MODE ==================== */
</script>
</body>
</html>
