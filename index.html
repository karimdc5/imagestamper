<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Stamper</title>
<script src="exifr.min.js"></script>
<style>
  :root { --bg:#f4f4f5; --panel:#fff; --text:#18181b; --muted:#71717a; --border:#e4e4e7; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f11; --panel:#1a1a1d; --text:#f4f4f5; --muted:#a1a1aa; --border:#2e2e33; --accent:#3b82f6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], input[type=number], select { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:14px; }
  input[type=range] { width:100%; }
  input[type=color] { width:100%; height:34px; border:1px solid var(--border); border-radius:6px; background:none; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { padding:10px 12px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; width:100%; margin-top:8px; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:2px dashed var(--border); border-radius:10px; padding:24px; text-align:center; cursor:pointer; color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #status { font-size:12px; color:var(--muted); margin-top:8px; min-height:16px; }
  #status.warn { color:#d97706; }
  .preview { display:flex; align-items:center; justify-content:center; min-height:300px; }
  canvas { max-width:100%; max-height:80vh; height:auto; border-radius:6px; box-shadow:0 2px 12px rgba(0,0,0,.2); }
  .empty { color:var(--muted); }
  .check { display:flex; align-items:center; gap:8px; font-size:13px; margin-top:12px; color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>Image Stamper</h1>
  <p>Add a photo to put a grey bar across the top with its date, time and GPS coordinates from the photo's metadata.</p>
</header>
<main>
  <section class="panel">
    <div id="drop">Click or drop a photo here<input id="file" type="file" accept="image/*" hidden></div>
    <div id="status"></div>

    <label>Left text (date / time)</label>
    <input id="left" type="text">
    <label>Right text (coordinates)</label>
    <input id="right" type="text">
    <label>Second line (optional, e.g. address or site name)</label>
    <input id="line2" type="text" placeholder="">
    <button id="geocode" class="secondary" disabled>Look up address from coordinates</button>

    <div class="row">
      <div><label>Coordinate format</label>
        <select id="coordFmt"><option value="dec">Decimal (47.6062, -122.3321)</option><option value="dms">DMS (47°36'22"N)</option></select></div>
      <div><label>Date format</label>
        <select id="dateFmt"><option value="us">09/25/2026 3:04 PM</option><option value="iso">2026-09-25 15:04:05</option><option value="long">Sep 25, 2026 15:04</option></select></div>
    </div>

    <div class="row">
      <div><label>Bar colour</label><input id="barColor" type="color" value="#3a3a3a"></div>
      <div><label>Text colour</label><input id="textColor" type="color" value="#ffffff"></div>
    </div>
    <label>Bar opacity: <span id="opVal"></span></label>
    <input id="opacity" type="range" min="0" max="100" value="70">
    <label>Bar height (% of image height): <span id="hVal"></span></label>
    <input id="height" type="range" min="3" max="20" step="0.5" value="6">
    <label class="check"><input id="bold" type="checkbox" checked> Bold text</label>

    <label>Save as</label>
    <select id="outFmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select>
    <button id="download" disabled>Download stamped image</button>
  </section>

  <section class="panel preview">
    <canvas id="canvas" hidden></canvas>
    <div id="empty" class="empty">Your stamped photo will show here.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let img = null, meta = { date: null, lat: null, lon: null }, fileName = 'photo';

const status = (msg, warn) => { $('status').textContent = msg; $('status').className = warn ? 'warn' : ''; };

$('drop').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && load(e.target.files[0]);
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => e.dataTransfer.files[0] && load(e.dataTransfer.files[0]));

async function load(file) {
  fileName = file.name.replace(/\.[^.]+$/, '');
  meta = { date: null, lat: null, lon: null };
  status('Reading metadata…');
  try {
    const data = await exifr.parse(file, { gps: true, tiff: true, exif: true });
    if (data) {
      meta.date = data.DateTimeOriginal || data.CreateDate || data.ModifyDate || null;
      if (typeof data.latitude === 'number' && typeof data.longitude === 'number') { meta.lat = data.latitude; meta.lon = data.longitude; }
    }
  } catch (err) { console.warn(err); }

  const msgs = [];
  if (!meta.date) { meta.date = new Date(file.lastModified); msgs.push('No capture date in metadata, so the file date is used instead.'); }
  if (meta.lat == null) msgs.push('No GPS data in this photo. Type the coordinates in by hand. (On iPhone, turn on "Location" in the share options before sending.)');
  status(msgs.length ? msgs.join(' ') : 'Date and GPS found in metadata.', msgs.length > 0);

  fillFields();
  $('line2').value = '';
  $('geocode').disabled = meta.lat == null;

  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { img = im; $('canvas').hidden = false; $('empty').hidden = true; $('download').disabled = false; draw(); };
  im.onerror = () => status('This browser can\'t display this file type. HEIC works in Safari; otherwise convert the photo to JPG first.', true);
  im.src = url;
}

function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return '';
  const f = $('dateFmt').value;
  if (f === 'iso') return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if (f === 'long') return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  let h = d.getHours() % 12 || 12;
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} ${h}:${pad(d.getMinutes())} ${d.getHours() < 12 ? 'AM' : 'PM'}`;
}
function dms(v, pos, neg) {
  const a = Math.abs(v), d = Math.floor(a), mf = (a - d) * 60, m = Math.floor(mf), s = ((mf - m) * 60).toFixed(1);
  return `${d}°${m}'${s}"${v >= 0 ? pos : neg}`;
}
function fmtCoords() {
  if (meta.lat == null) return '';
  return $('coordFmt').value === 'dms'
    ? `${dms(meta.lat, 'N', 'S')} ${dms(meta.lon, 'E', 'W')}`
    : `${meta.lat.toFixed(6)}, ${meta.lon.toFixed(6)}`;
}
function fillFields() { $('left').value = fmtDate(meta.date); $('right').value = fmtCoords(); }

function draw() {
  if (!img) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  canvas.width = W; canvas.height = H;
  ctx.drawImage(img, 0, 0, W, H);

  const hasLine2 = $('line2').value.trim() !== '';
  const barH = Math.round(H * (+$('height').value / 100) * (hasLine2 ? 1.7 : 1));
  ctx.globalAlpha = +$('opacity').value / 100;
  ctx.fillStyle = $('barColor').value;
  ctx.fillRect(0, 0, W, barH);
  ctx.globalAlpha = 1;

  const unit = H * (+$('height').value / 100);
  let size = Math.round(unit * 0.5);
  const weight = $('bold').checked ? '600' : '400';
  const pad = Math.round(W * 0.02);
  const left = $('left').value, right = $('right').value;
  const setFont = s => ctx.font = `${weight} ${s}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  setFont(size);
  // Shrink the text if the left and right text would overlap.
  while (size > 8 && ctx.measureText(left).width + ctx.measureText(right).width + pad * 3 > W) { size--; setFont(size); }

  ctx.fillStyle = $('textColor').value;
  ctx.textBaseline = 'middle';
  const y1 = hasLine2 ? unit * 0.55 : barH / 2;
  ctx.textAlign = 'left';  ctx.fillText(left, pad, y1);
  ctx.textAlign = 'right'; ctx.fillText(right, W - pad, y1);

  if (hasLine2) {
    let s2 = Math.round(size * 0.85); setFont(s2);
    const t = $('line2').value;
    while (s2 > 8 && ctx.measureText(t).width + pad * 2 > W) { s2--; setFont(s2); }
    ctx.textAlign = 'left'; ctx.fillText(t, pad, unit * 1.25);
  }
}

['left','right','line2','barColor','textColor','opacity','height','bold'].forEach(id => $(id).addEventListener('input', draw));
['coordFmt','dateFmt'].forEach(id => $(id).addEventListener('change', () => { fillFields(); draw(); }));
const syncLabels = () => { $('opVal').textContent = $('opacity').value + '%'; $('hVal').textContent = $('height').value + '%'; };
$('opacity').addEventListener('input', syncLabels); $('height').addEventListener('input', syncLabels); syncLabels();

$('geocode').onclick = async () => {
  if (meta.lat == null) return;
  $('geocode').disabled = true; $('geocode').textContent = 'Looking up…';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${meta.lat}&lon=${meta.lon}&zoom=18&addressdetails=1`);
    const j = await r.json();
    const a = j.address || {};
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const city = a.city || a.town || a.village || a.suburb || '';
    $('line2').value = [street, city, a.state].filter(Boolean).join(', ') || j.display_name || '';
    draw();
  } catch { status('Address lookup failed. Type the address in by hand.', true); }
  $('geocode').disabled = false; $('geocode').textContent = 'Look up address from coordinates';
};

$('download').onclick = () => {
  const type = $('outFmt').value;
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `${fileName}-stamped.${type === 'image/png' ? 'png' : 'jpg'}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, type, 0.92);
};
</script>
</body>
</html>
